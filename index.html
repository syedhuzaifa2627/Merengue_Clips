<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title> MerengueClips </title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="topbar">

    <div class="left">
      <h2 class="logo">☰ Merengue Clips</h2>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search" />
      <button id="searchButton">Search 🔍</button>
    </div>

    <p class="right">
      Log Out
    </p>

  </header>

 
  <div class="layout">



    <div class="sidebar">
      <ul>
        <li>🏠 Home</li>
        <li>🎬 Shorts</li>
        <li>📺 Subscriptions</li>
      </ul>

      <hr>

      <ul>
        <li>👤 Your Channel</li>
        <li>🕒 History</li>
        <li>⏱ Watch Later</li>
      </ul>

      <hr>

      <ul>
        <li>🔥 Trending</li>
        <li>🎵 Music</li>
        <li>🎮 Gaming</li>
      </ul>

    </div>


    <div class="content">

      <div class="categories">
        <div class="categories">
          <button class="chip active">All</button>
          <button class="chip">Website</button>
          <button class="chip">Music</button>
          <button class="chip">Gaming</button>
          <button class="chip">Podcast</button>
          <button class="chip">Vlog</button>
          <button class="chip">Education</button>
          <button class="chip">Fitness</button>
        </div>

      </div>


      <div id="videos" class="video-grid"></div>

    </div>

  </div>

  <script src="app.js"></script>
</body>

</html>
